name: update data

on:
  schedule:
    - cron: "20 */3 * * *" # every 3 hours, catches terminals that report late
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/update.mjs
      - name: commit data
        run: |
          git config user.name "OwlChainLabs bot"
          git config user.email "OwlChainLabs@users.noreply.github.com"
          git add public/data.json public/og.png public/index.html
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
