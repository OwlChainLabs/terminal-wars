name: update data

on:
  schedule:
    - cron: "15 6 * * *" # every day 06:15 UTC, after defillama has the previous day
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: commit data
        run: |
          git config user.name "OwlChainLabs bot"
          git config user.email "OwlChainLabs@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
