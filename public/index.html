<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>terminal wars · who prints the most on solana</title>
  <meta name="description" content="daily revenue leaderboard of solana trading terminals. solana chain only. by owl chain labs.">
  <link rel="icon" href="owl.svg" type="image/svg+xml">
  <meta property="og:title" content="terminal wars">
  <meta property="og:description" content="which solana trading terminal makes the most from you? daily leaderboard.">
  <meta property="og:url" content="https://wars.owlchainlabs.xyz">
  <meta property="og:image" content="https://wars.owlchainlabs.xyz/og.png?v=2026-10-12">
  <meta name="twitter:image" content="https://wars.owlchainlabs.xyz/og.png?v=2026-10-12">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@OwlChainLabs">
  <style>
    :root {
      --bg: #070a16; --card: rgba(16, 21, 42, .78); --line: rgba(120, 132, 190, .18);
      --text: #f2f2f5; --muted: #9aa0b8; --green: #14f195; --purple: #9945ff; --red: #ff5c7a; --gold: #ffc857;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body { min-height: 100vh; color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: inherit; text-decoration: none; }
    .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .5; }
    .glow.a { width: 600px; height: 600px; background: #5a1530; top: -220px; right: -140px; animation: drift 20s ease-in-out infinite alternate; }
    .glow.b { width: 520px; height: 520px; background: #0c5c49; bottom: -240px; left: -160px; animation: drift 24s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(-70px, 50px) scale(1.1); } }

    .page { max-width: 1120px; margin: 0 auto; padding: 22px 22px 18px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 36px; height: 36px; transition: transform .2s; }
    .brand:hover img { transform: rotate(-8deg) scale(1.08); }
    .wordmark { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
    .wordmark span { color: var(--green); }
    .social { display: flex; gap: 8px; }
    .social a { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 11px; border: 1px solid var(--line);
                background: var(--card); font-size: .88rem; font-weight: 600; }
    .social a:hover { border-color: var(--green); }
    .social svg { width: 16px; height: 16px; fill: currentColor; }

    .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    h1 .vs { background: linear-gradient(90deg, var(--red), var(--gold), var(--green)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: #c3c7dc; margin-top: 10px; font-size: 1.05rem; }
    .meta { color: var(--muted); font-size: .82rem; margin-top: 6px; }
    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: .9rem;
                   padding: 8px 16px; border-radius: 9px; cursor: pointer; }
    .tabs button.on { background: var(--text); color: #06080f; }

    .grid { display: grid; grid-template-columns: 1fr 1.55fr; gap: 16px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; backdrop-filter: blur(8px); }

    .duel h2, .board h2 { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .fighters { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
    .fighter img, .fighter .ph { width: 58px; height: 58px; border-radius: 50%; display: block; margin: 0 auto 8px; background: #1a2140; object-fit: cover; }
    .fighter .n { font-weight: 800; font-size: 1.1rem; }
    .fighter .m { font-weight: 900; font-size: 1.5rem; margin-top: 2px; }
    .vsbadge { font-weight: 900; font-size: 1.1rem; color: var(--gold); transform: rotate(-8deg); }
    .tug { margin-top: 16px; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: #1a2140; }
    .tug div { height: 100%; transition: width .6s ease; }
    .tug .l { background: linear-gradient(90deg, #0b8d63, var(--green)); }
    .tug .r { background: linear-gradient(90deg, var(--purple), #6b3bd1); }
    .verdict { margin-top: 12px; font-weight: 700; color: #c3c7dc; text-align: center; font-size: .95rem; }
    .actions { display: grid; gap: 8px; margin-top: 16px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 12px; font-weight: 800;
           border: 0; font: inherit; font-weight: 800; cursor: pointer; }
    .btn svg { width: 17px; height: 17px; fill: currentColor; }
    .btn.x { background: var(--text); color: #06080f; box-shadow: 0 10px 30px rgba(20,241,149,.18); }
    .btn.dl { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn.dl:hover { border-color: var(--green); }

    .row { display: grid; grid-template-columns: 28px 22px 34px 1fr 92px 120px 70px; align-items: center; gap: 10px;
           padding: 9px 6px; border-radius: 12px; }
    .row + .row { border-top: 1px solid rgba(120,132,190,.08); }
    .row:hover { background: rgba(255,255,255,.03); }
    .rk { font-weight: 900; color: var(--muted); text-align: center; }
    .row:nth-child(2) .rk { color: var(--gold); } .row:nth-child(3) .rk { color: #d6dbe8; } .row:nth-child(4) .rk { color: #d79a63; }
    .chg { font-size: .75rem; font-weight: 800; text-align: center; }
    .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }
    .logo { width: 30px; height: 30px; border-radius: 50%; background: #1a2140; object-fit: cover; }
    .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nm small { display: block; color: var(--muted); font-weight: 600; font-size: .72rem; }
    .val { text-align: right; font-weight: 800; }
    .pct { text-align: right; font-size: .8rem; font-weight: 700; }
    .bar { height: 8px; border-radius: 4px; background: #1a2140; overflow: hidden; }
    .bar div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--purple), var(--green)); }
    .spark { width: 70px; height: 26px; }
    .head { color: var(--muted); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .head:hover { background: none; }

    .empty { color: var(--muted); padding: 30px 0; text-align: center; }
    footer { margin-top: 16px; color: var(--muted); font-size: .78rem; text-align: center; line-height: 1.6; }
    footer a { color: var(--green); }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 24px 20px 30px 1fr 84px 56px; }
      .row .barcell { display: none; }
      .social a span { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky"><div class="glow a"></div><div class="glow b"></div></div>
  <div class="page">
    <header>
      <a class="brand" href="https://owlchainlabs.xyz"><img src="owl.svg" alt=""><span class="wordmark">owlchain<span>labs</span></span></a>
      <nav class="social">
        <a href="https://x.com/OwlChainLabs" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span>@OwlChainLabs</span></a>
        <a href="https://github.com/OwlChainLabs/terminal-wars" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.1 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.3v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg><span>source</span></a>
      </nav>
    </header>

    <div class="top">
      <div>
        <h1>terminal <span class="vs">wars</span> ⚔️</h1>
        <p class="sub">which solana terminal is printing the most from traders?</p>
        <p class="meta" id="meta">loading…</p>
      </div>
      <div class="tabs" id="tabs">
        <button data-p="d1" class="on">24h</button><button data-p="d7">7d</button><button data-p="d30">30d</button>
      </div>
    </div>

    <div class="grid">
      <section class="card duel">
        <h2>main event</h2>
        <div id="duel"><div class="empty">loading…</div></div>
        <div class="actions">
          <button class="btn x" id="post"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>post the standings</button>
          <button class="btn dl" id="download">⬇ download image</button>
        </div>
      </section>

      <section class="card board">
        <h2>leaderboard · revenue on solana</h2>
        <div id="board"><div class="empty">loading…</div></div>
      </section>
    </div>

    <footer>
      data: <a href="https://defillama.com" target="_blank" rel="noopener">defillama</a> · daily revenue, solana chain only · updates once a day ·
      <span id="stale"></span>
      open source by <a href="https://owlchainlabs.xyz">owl chain labs</a>
    </footer>
  </div>

<script>
const LABEL = { d1: "24h", d7: "7d", d30: "30d" };
const PREV = { d1: "d1prev", d7: "d7prev", d30: "d30prev" };
let DATA = null, period = "d1";

const usd = (n) => n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "m" : n >= 1e3 ? "$" + (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "k" : "$" + Math.round(n);
const pct = (a, b) => b > 0 ? ((a - b) / b) * 100 : null;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const logo = (t, cls) => t.logo ? `<img class="${cls}" src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="${cls} ph"></div>`;

function spark(values) {
  const v = values.slice(-30); if (v.length < 2) return "";
  const max = Math.max(...v, 1), w = 70, h = 26;
  const pts = v.map((x, i) => `${(i / (v.length - 1)) * w},${h - 2 - (x / max) * (h - 4)}`).join(" ");
  const up = v.at(-1) >= v[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up ? "#14f195" : "#ff5c7a"}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

function ranked() {
  return DATA.terminals.filter((t) => !t.stale && t[period] > 0).sort((a, b) => b[period] - a[period]);
}

function render() {
  const list = ranked();
  if (!list.length) { document.getElementById("board").innerHTML = `<div class="empty">no data yet</div>`; return; }
  const max = list[0][period];

  // duel
  const [a, b] = list;
  if (b) {
    const share = (a[period] / (a[period] + b[period])) * 100;
    const lead = a[period] / b[period];
    const verdict = lead > 2 ? `${esc(a.name)} is cooking ${esc(b.name)} 🔥` : lead > 1.2 ? `${esc(a.name)} leads by ${((lead - 1) * 100).toFixed(0)}%` : `neck and neck. ${(Math.abs(lead - 1) * 100).toFixed(0)}% apart 👀`;
    document.getElementById("duel").innerHTML = `
      <div class="fighters">
        <div class="fighter">${logo(a, "")}<div class="n">${esc(a.name)}</div><div class="m up">${usd(a[period])}</div></div>
        <div class="vsbadge">VS</div>
        <div class="fighter">${logo(b, "")}<div class="n">${esc(b.name)}</div><div class="m" style="color:#b48cff">${usd(b[period])}</div></div>
      </div>
      <div class="tug"><div class="l" style="width:${share}%"></div><div class="r" style="width:${100 - share}%"></div></div>
      <div class="verdict">${verdict}</div>`;
  }

  // board
  const rows = list.map((t, i) => {
    const ch = period === "d1" ? (t.rankChange ?? 0) : 0;
    const chHtml = period !== "d1" ? "" : ch > 0 ? `<span class="up">▲${ch}</span>` : ch < 0 ? `<span class="down">▼${-ch}</span>` : `<span class="flat">–</span>`;
    const p = pct(t[period], t[PREV[period]]);
    const pHtml = p == null ? "" : `<span class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "+" : ""}${p.toFixed(0)}%</span>`;
    return `<div class="row">
      <div class="rk">${i + 1}</div><div class="chg">${chHtml}</div>${logo(t, "logo")}
      <div class="nm">${esc(t.name)}<small>${esc(t.category.toLowerCase())}</small></div>
      <div class="val">${usd(t[period])}<div class="pct">${pHtml}</div></div>
      <div class="barcell"><div class="bar"><div style="width:${(t[period] / max) * 100}%"></div></div></div>
      <div>${spark(t.spark)}</div>
    </div>`;
  }).join("");
  document.getElementById("board").innerHTML =
    `<div class="row head"><div>#</div><div></div><div></div><div>terminal</div><div class="val">${LABEL[period]}</div><div class="barcell">share</div><div>30d</div></div>` + rows;
}

function shareText() {
  const list = ranked().slice(0, 5);
  const medals = ["🥇", "🥈", "🥉", "4.", "5."];
  // tag only the winner: gets their attention without looking like spam
  const lines = list.map((t, i) => `${medals[i]} ${i === 0 && t.twitter ? "@" + t.twitter.replace(/^@/, "") : t.name} ${usd(t[period])}`).join("\n");
  const leaderChanged = period === "d1" && list[0] && (list[0].rankChange ?? 0) > 0;
  const hook = leaderChanged ? `new #1 on solana: ${list[0].name} 👑` : `who's printing the most from solana traders? ⚔️`;
  return `${hook}\n\nlast ${LABEL[period]}, solana only:\n${lines}\n\n`;
}

function shareUrl() {
  // a new day gets a new url, so x fetches a fresh preview card
  const day = DATA.terminals.find((t) => !t.stale)?.lastDay ?? "";
  return `https://wars.owlchainlabs.xyz/?d=${day}`;
}

function drawImage() {
  const list = ranked().slice(0, 6);
  const c = document.createElement("canvas"); c.width = 1200; c.height = 675;
  const g = c.getContext("2d");
  const bg = g.createLinearGradient(0, 0, 1200, 675); bg.addColorStop(0, "#0a0d1a"); bg.addColorStop(1, "#1b1a3a");
  g.fillStyle = bg; g.fillRect(0, 0, 1200, 675);
  g.fillStyle = "#f2f2f5"; g.font = "900 64px system-ui, Segoe UI, sans-serif"; g.fillText("terminal wars", 60, 105);
  g.fillStyle = "#9aa0b8"; g.font = "600 26px system-ui, Segoe UI, sans-serif";
  g.fillText(`solana revenue · last ${LABEL[period]} · ${DATA.terminals[0]?.lastDay ?? ""}`, 60, 148);
  const max = list[0][period];
  list.forEach((t, i) => {
    const y = 188 + i * 68;
    g.fillStyle = i === 0 ? "#ffc857" : "#9aa0b8"; g.font = "900 30px system-ui, sans-serif"; g.fillText(String(i + 1), 60, y + 32);
    g.fillStyle = "#f2f2f5"; g.font = "700 30px system-ui, sans-serif"; g.fillText(t.name, 110, y + 32);
    g.fillStyle = "#1a2140"; g.fillRect(420, y + 10, 520, 26);
    const grad = g.createLinearGradient(420, 0, 940, 0); grad.addColorStop(0, "#9945ff"); grad.addColorStop(1, "#14f195");
    g.fillStyle = grad; g.fillRect(420, y + 10, 520 * (t[period] / max), 26);
    g.fillStyle = "#f2f2f5"; g.font = "800 30px system-ui, sans-serif"; g.textAlign = "right"; g.fillText(usd(t[period]), 1140, y + 32); g.textAlign = "left";
  });
  g.fillStyle = "#14f195"; g.font = "800 26px system-ui, sans-serif"; g.fillText("wars.owlchainlabs.xyz", 60, 640);
  g.fillStyle = "#9aa0b8"; g.textAlign = "right"; g.font = "600 22px system-ui, sans-serif"; g.fillText("data: defillama · @OwlChainLabs", 1140, 640);
  return c;
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !DATA) return;
  period = b.dataset.p;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("post").addEventListener("click", () => {
  if (!DATA) return;
  window.open(`https://x.com/intent/post?text=${encodeURIComponent(shareText())}&url=${encodeURIComponent(shareUrl())}`, "_blank", "noopener");
});
document.getElementById("download").addEventListener("click", () => {
  if (!DATA) return;
  const a = document.createElement("a");
  a.download = `terminal-wars-${LABEL[period]}.png`; a.href = drawImage().toDataURL("image/png"); a.click();
});

fetch("data.json", { cache: "no-cache" })
  .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
  .then((d) => {
    DATA = d;
    const day = d.terminals.find((t) => !t.stale)?.lastDay;
    document.getElementById("meta").textContent = `data for ${day} · updated ${new Date(d.updatedAt).toLocaleString()}`;
    const stale = d.terminals.filter((t) => t.stale).map((t) => t.name);
    if (stale.length) document.getElementById("stale").textContent = `not reporting right now: ${stale.join(", ")} · `;
    render();
  })
  .catch(() => {
    document.getElementById("meta").textContent = "first data is being collected, check back in a few minutes";
    document.getElementById("board").innerHTML = `<div class="empty">no data yet</div>`;
    document.getElementById("duel").innerHTML = `<div class="empty">no data yet</div>`;
  });
</script>
</body>
</html>
